name = "web-desa-loji"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [{ pattern = "loji.web.id/*", zone_name = "loji.web.id" }]

# ─── Cloudflare D1 (konten SQLite) ───────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "web-desa-loji-db"
database_id = "c578c1ca-4e96-4142-b0f0-4ceffe035ed9"

# ─── Cloudflare R2 (media binary) ────────────────────────────────────────────
# Dinonaktifkan sampai bucket R2 dibuat di akun Cloudflare. Jika ingin
# mengaktifkan media storage, uncomment blok di bawah dan buat bucket terlebih dahulu.
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "web-desa-loji-media"

# ─── Cloudflare KV (sesi TTL) ────────────────────────────────────────────────
# Astro session storage memakai binding "SESSION". Kita arahkan ke namespace
# yang sudah ada di akun agar Wrangler tidak mencoba membuat ulang.
[[kv_namespaces]]
binding = "SESSION"
id = "f086c8e11015471e8355d1cad46a7ca4"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "f086c8e11015471e8355d1cad46a7ca4"

# ─── Cron triggers (dinonaktifkan) ───────────────────────────────────────────
# Backup mingguan otomatis dimatikan. Backup dilakukan manual lewat tombol
# export di panel admin (lihat docs handover). Untuk mengaktifkan lagi:
# isi crons = ["0 0 * * 0"], butuh workers.dev subdomain akun terdaftar.
[triggers]
crons = []

# ─── Local development ────────────────────────────────────────────────────────
[dev]
port = 4321
